name: VieNeu voice demos
on:
  push:
    branches: [voice-demos]
    paths: [tools/vieneu_demos.py, .github/workflows/vieneu-demos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install vieneu
      - run: python tools/vieneu_demos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voice-demos
          git commit -m "Add VieNeu-TTS voice demos [skip ci]"
          git push
